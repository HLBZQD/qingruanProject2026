    - data:
        code: "import json\nfrom datetime import datetime, timedelta\n\ndef main(punch_records:\
          \ dict) -> dict:\n    records = punch_records.get(\"records\", [])\n   \
          \ \n    diet = [r for r in records if r.get(\"punch_type\") == \"diet\"\
          ]\n    exer = [r for r in records if r.get(\"punch_type\") == \"exercise\"\
          ]\n    \n    total = len(records)\n    d_total = len(diet)\n    e_total\
          \ = len(exer)\n    d_ok = sum(1 for r in diet if r.get(\"completion_status\"\
          ) == \"completed\")\n    e_ok = sum(1 for r in exer if r.get(\"completion_status\"\
          ) == \"completed\")\n    \n    d_rate = round(d_ok / d_total, 2) if d_total\
          \ > 0 else 0.0\n    e_rate = round(e_ok / e_total, 2) if e_total > 0 else\
          \ 0.0\n    \n    today = datetime.now().date()\n    trend_map = {}\n   \
          \ for i in range(6, -1, -1):\n        d = (today - timedelta(days=i)).isoformat()\n\
          \        trend_map[d] = {\"date\": d, \"diet_completed\": 0, \"exercise_completed\"\
          : 0}\n    \n    for r in records:\n        t = r.get(\"punch_time\", \"\"\
          )\n        if t and r.get(\"completion_status\") == \"completed\":\n   \
          \         day = t[:10]\n            if day in trend_map:\n             \
          \   if r.get(\"punch_type\") == \"diet\":\n                    trend_map[day][\"\
          diet_completed\"] += 1\n                elif r.get(\"punch_type\") == \"\
          exercise\":\n                    trend_map[day][\"exercise_completed\"]\
          \ += 1\n    \n    trend = list(trend_map.values())\n    \n    return {\n\
          \        \"stats_json\": json.dumps({\n            \"diet_completion_rate\"\
          : d_rate,\n            \"exercise_completion_rate\": e_rate,\n         \
          \   \"total_punches\": total,\n            \"last_7_days_trend\": trend\n\
          \        }, ensure_ascii=False),\n        \"stats_text\": f\"饮食完成率：{d_rate*100:.0f}%（{d_ok}/{d_total}），运动完成率：{e_rate*100:.0f}%（{e_ok}/{e_total}），总打卡\
          \ {total} 次。\"\n    }"
        code_language: python3
        outputs:

        - id: f517f4e4-aa06-43fe-82a5-3e4314d0a3a2
          role: system
          text: '你是一个专业的健康数据分析师。根据用户的饮食和运动打卡数据，给出依从性评估和改进建议。


            # 分析维度

            1. 按类型汇总饮食/运动完成率

            2. 近7天趋势变化

            3. 依从性综合评语

            4. 2-3条具体可执行的改进建议


            # 注意事项

            - 基于客观数据，不做主观猜测

            - 打卡不足7天时标注数据量提示

            - 改进建议要具体可操作，避免笼统的"多运动"

            - adherence_comment 用 Markdown 格式（含**加粗**、- 列表）'
        - id: 915fa519-0d7d-4c91-9d17-3d9b422d5c66
          role: user
          text: "分析以下打卡数据：\n{{#1783075860135.stats_text#}}\n\n\n必须只输出纯 JSON（不要```json包裹）：\n\
            \n{\n  \"adherence_comment\": \"依从性评语（Markdown格式）\",\n  \"improvement_suggestions\"\
            : [\"具体建议1\", \"具体建议2\"]\n}"
        reasoning_format: separated
        selected: false
        title: LLM
        type: llm
        vision:
          enabled: false
      height: 88

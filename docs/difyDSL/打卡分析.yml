    - data:
        code: "import json\n\ndef main(stats_json: str, llm_output: str) -> dict:\n\
          \    try:\n        stats = json.loads(stats_json)\n    except:\n       \
          \ stats = {}\n    \n    try:\n        llm = json.loads(llm_output)\n   \
          \ except:\n        llm = {}\n    \n    suggestions = llm.get(\"improvement_suggestions\"\
          , [])\n    if not isinstance(suggestions, list):\n        suggestions =\
          \ [str(suggestions)]\n    \n    return {\n        \"text\": json.dumps({\n\
          \            \"diet_completion_rate\": float(stats.get(\"diet_completion_rate\"\
          , 0)),\n            \"exercise_completion_rate\": float(stats.get(\"exercise_completion_rate\"\
          , 0)),\n            \"total_punches\": int(stats.get(\"total_punches\",\
          \ 0)),\n            \"last_7_days_trend\": stats.get(\"last_7_days_trend\"\
          , []),\n            \"adherence_comment\": str(llm.get(\"adherence_comment\"\
          , \"\")),\n            \"improvement_suggestions\": suggestions\n      \
          \  }, ensure_ascii=False)\n    }"
        code_language: python3
